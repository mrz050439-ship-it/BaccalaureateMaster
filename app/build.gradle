// Declarative module build file, readable by Android Studio and by CodeAssist's
// static Gradle importer (CodeAssist never executes build scripts).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bacmaster.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bacmaster.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.5'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies on purpose: pure Android framework + org.json,
// so the project builds inside CodeAssist without any library downloads.
dependencies {
}
